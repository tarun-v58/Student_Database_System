# Docker's embedded DNS server. Re-check names every 10 seconds.
resolver 127.0.0.11 valid=10s ipv6=off;

# Use the client's X-Request-ID if it sent one, otherwise generate one.
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

log_format with_upstream '$remote_addr [$time_local] "$request" $status '
                         'req_id=$req_id upstream=$upstream_addr '
                         'rt=$request_time urt=$upstream_response_time';

upstream student_api {
    zone student_api 64k;
    server student-api:8000 resolve max_fails=3 fail_timeout=10s;
}

server {
    listen 80;

    access_log /var/log/nginx/access.log with_upstream;

    client_max_body_size 1m;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://student_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $req_id;

        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
}